intro: Agárrate de la silla, que ahora te voy a mostrar lo que he creado. Échale un ojo, sin afán, y cualquier cosa, pregúntame por lo que no veas.
introEstratega: La estrategia también es obra. Conceptos, calendarios y roadmaps reales, con lo que lograron.
introFilmmaker: Eventos, marcas y cuentas que se ven como cine. Rodado en Sony a7 IV y Osmo Pocket 3.
introEditor: Edito para que se queden. Los primeros 3 segundos deciden si alguien sigue mirando, y cada corte tiene una razón.
