relato: |-
  ## El reto
  El evento tenía que cumplir tres objetivos al mismo tiempo:

  - Reactivar una comunidad que llevaba más de un año fría.
  - Mostrar un sistema propio que diferenciara a la marca de su competencia.
  - Preparar a la marca para subir el precio de sus servicios.

  Para aterrizar las ideas respondimos cuatro preguntas: ¿qué es?, ¿qué muestra?, ¿de qué habla? y ¿para quién?

  ## El naming
  Tuve dos opciones sobre la mesa.

  - **El hilo púrpura.** Unía la teoría del hilo rojo con la vaca púrpura. La fricción: había que conocer los dos conceptos para conectar con él.
  - **Centauro.** Un ser mítico que todos conocen: simple, tangible y fácil de recordar.

  Ganó el centauro, que luego se transformó en Zentaurus: inspirado en la disciplina del zen, con el Taurus del inglés.

  ## El concepto como herramienta
  El mercado holístico suele quedarse en un registro muy imaginario. La pregunta era cómo darle un significado tangible, con un mapa fácil de accionar.

  Primero definí los elementos de la narrativa: caballo, humano, arco, flecha y viento. Después escribí la historia que los une:

  > El centauro funciona porque sus dos naturalezas van en la misma dirección. Cuando razón y emoción se alinean, aparece la posibilidad de apuntar. Pero apuntar a qué es la pregunta que ninguna de las dos mitades puede responder sola. Ahí aparece la flecha, que va hacia un objetivo diferencial, y el arco, que la lleva a su máxima altura.

  ## Un canvas de siete ejes
  Con el concepto listo, armé un canvas para ordenar todo el evento:

  - **Concepto:** la idea que ordena todo.
  - **Contenidos:** antes, durante y después del evento.
  - **Roadmap y comunicación:** fechas, fases y frecuencias.
  - **Dinámicas:** lo que pasa en sala.
  - **Entregables:** lo que se llevan los participantes.
  - **Colaboraciones:** speakers que suman otra voz.
  - **¿Qué pasa?:** horarios, logística y estructura del evento.

  ## La comunicación, por etapas
  Antes de decidir piezas, definí qué tenía que sentir la audiencia en cada momento.

  - **Antes · storytelling desde el dolor.** ¿Por qué hacemos lo que hacemos? ¿Qué pasó mientras la marca estuvo ausente? En stories hicimos un recap de hitos, dolores y procesos para crear cercanía, y anunciamos el evento por historias antes que por reels.
  - **Antes · expectativa.** El anuncio oficial en el feed, con un contenido más racional sobre por qué asistir y llamados directos a unirse a un grupo de WhatsApp, que se volvió el canal directo con la comunidad.
  - **Antes · urgencia.** Cuatro días antes, llamados directos: «últimos lugares», «en tantas horas cerramos puertas». En el grupo, preguntas para abrir la conversación.
  - **Durante · pertenencia.** Stories tipo highlights mientras pasaba el evento. El enfoque era que fuera aplicable: que la gente recibiera valor y lo llevara a su caso, con análisis 1:1 de ejemplo. Al cerrar, un carrusel con la síntesis del día y una tarea que impulsó la participación del día dos.
  - **Después · que quieran seguir.** Dos semanas para fidelizar: preguntas abiertas en la comunidad, recap de sensaciones y highlights de speakers. En Instagram volvimos al storytelling, para atraer nuevas audiencias y sostener la cercanía.

  ## Lo que sigue
  Este modelo de eventos se va a replicar para escalar la marca.
