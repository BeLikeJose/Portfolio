titulo: 'Zentaurus: un concepto para llenar un evento en tres semanas'
etiquetas:
  - concepto creativo
  - naming
  - evento
  - estrategia de contenidos
portada: /media/obra/zentaurus/portada.webp
video: /media/obra/zentaurus/video.mp4
orden: 1
cliente: Marca de coaching
contexto: Una marca en re-branding, una comunidad fría hace más de un año, un meetup nuevo y tres semanas para llenarlo. El mercado holístico se queda en lo imaginario; había que volverlo tangible.
decision: Un centauro. Razón y emoción, humano y caballo, funcionan cuando van en la misma dirección; la flecha apunta a un objetivo diferencial y el arco la potencia. Nació como Centauro (antes, el hilo púrpura) y se volvió Zentaurus, de Zen + Taurus.
construi: Naming y concepto · un canvas de siete ejes (concepto, contenidos, roadmap, dinámicas, entregables, colaboraciones y estructura del evento) · estrategia de contenidos en etapas, antes, durante y después del evento.
resultado: Comunidad reactivada. De cero a 26 personas dentro de un grupo, todas interactuando.
